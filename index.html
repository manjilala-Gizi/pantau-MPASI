<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pantau MP-ASI Moncongloe</title>
<meta name="theme-color" content="#2E6B4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --surface-2:#F8FAF6; --ink:#17302A; --muted:#5B6D65; --line:#DCE4DC;
  --primary:#2E6B4A; --primary-ink:#FFFFFF; --primary-soft:#E2EFE6;
  --accent:#B57A0C; --accent-soft:#F8EDD4;
  --danger:#B3402C; --danger-soft:#F7E1DC;
  --info:#2F5E86; --info-soft:#E1ECF5;
  --shadow:0 1px 2px rgba(23,48,42,.06),0 4px 14px rgba(23,48,42,.06);
  --radius:12px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1814; --surface:#16231E; --surface-2:#1B2A24; --ink:#E4EEE8; --muted:#9BB0A6; --line:#29392F;
    --primary:#72C193; --primary-ink:#0E1814; --primary-soft:#1D3A2B;
    --accent:#E2B04A; --accent-soft:#3A2F16;
    --danger:#E58470; --danger-soft:#3E231E;
    --info:#86B6E0; --info-soft:#1C2C3B;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1814; --surface:#16231E; --surface-2:#1B2A24; --ink:#E4EEE8; --muted:#9BB0A6; --line:#29392F;
  --primary:#72C193; --primary-ink:#0E1814; --primary-soft:#1D3A2B;
  --accent:#E2B04A; --accent-soft:#3A2F16;
  --danger:#E58470; --danger-soft:#3E231E;
  --info:#86B6E0; --info-soft:#1C2C3B;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.num{font-variant-numeric:tabular-nums}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--primary);color:var(--primary-ink);padding:10px 16px}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:16px;font-weight:800;letter-spacing:.2px}
.brand small{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap;border:0;color:inherit;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--primary)}

/* cards and blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;font-weight:700}
.card h3{font-size:14px;font-weight:700}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}

.banner{border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--accent-soft);color:var(--ink)}
.banner.err{background:var(--danger-soft);color:var(--ink)}
.banner.info{background:var(--info-soft);color:var(--ink)}
.banner.ok{background:var(--primary-soft);color:var(--ink)}
.banner b{font-weight:700}

.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}

.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:999px}

/* buttons & inputs */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,.yn button:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--info);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=tel],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:15px;color:var(--ink);font-weight:500}
input[readonly]{background:var(--surface-2)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.amber{background:var(--accent-soft);color:var(--accent)}
.tag.green{background:var(--primary-soft);color:var(--primary)}
.tag.blue{background:var(--info-soft);color:var(--info)}
.tag.grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .nm{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.item .meta{font-size:12.5px;color:var(--muted)}
.score{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.score.done{background:var(--primary-soft);color:var(--primary)}
.score.low{background:var(--accent-soft);color:var(--accent)}
.score.todo{border:2px dashed var(--line);color:var(--muted);font-size:11px}

/* form: food groups */
.child{display:flex;flex-direction:column;gap:4px}
.child .nm{font-size:18px;font-weight:800}
.fg{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.fg:first-of-type{border-top:0}
.fg .n{grid-row:span 2;width:28px;height:28px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.fg .q{font-weight:700;font-size:15px}
.fg .ex{font-size:12.5px;color:var(--muted)}
.fg .yn{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.yn button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;color:var(--muted)}
.yn button[aria-pressed="true"].y{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.yn button[aria-pressed="true"].t{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fg.missing .q{color:var(--danger)}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--primary)}
.sticky-save{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.sticky-save .sum{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td:first-child{white-space:normal}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{display:flex;align-items:center;gap:8px}
.bar .t{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden;min-width:60px}
.bar .t i{display:block;height:100%;background:var(--primary)}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .card{width:100%;max-width:400px}
.logo{width:56px;height:56px;border-radius:14px;background:var(--primary);display:grid;place-items:center}
.logo svg{width:34px;height:34px}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
@media (min-width:600px){.modal-bg{align-items:center}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.demo-flag{background:repeating-linear-gradient(135deg,var(--accent-soft),var(--accent-soft) 10px,var(--surface) 10px,var(--surface) 20px);border:1px dashed var(--accent)}
.file-drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface-2)}
details summary{cursor:pointer;font-weight:700;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" aria-live="polite"></div>
<div id="overlay"></div>

<script src="xlsx.full.min.js"></script>
<script>
(function(){
"use strict";

/* ============ KONSTANTA ============ */
const APP_VERSI = "0.2 (uji coba)";
const STORE_KEY = "mpasi_moncongloe_v1";
const PUSKESMAS = "MONCONGLOE";
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const BULAN_PANTAU = [3,6,9,12];
const FOODS = [
  {k:"asi", q:"Minum ASI?", ex:"Menyusu langsung atau ASI perah, siang atau malam"},
  {k:"sereal", q:"Makan nasi, bubur, atau makanan pokok lain?", ex:"Nasi, bubur, jagung, ubi, singkong, roti, mi, biskuit"},
  {k:"kacang", q:"Makan kacang-kacangan?", ex:"Tempe, tahu, kacang hijau, kacang tanah"},
  {k:"susu", q:"Minum susu atau makan olahan susu?", ex:"Susu formula, susu UHT/bubuk, keju, yoghurt (bukan ASI)"},
  {k:"daging/unggas", q:"Makan ikan, daging, atau ayam?", ex:"Ikan bandeng, cakalang, teri, katombo, ayam, hati, daging, udang"},
  {k:"telur", q:"Makan telur?", ex:"Telur ayam, bebek, puyuh"},
  {k:"buah_sayur_vita", q:"Makan sayur hijau tua atau buah/sayur kuning-oranye?", ex:"Daun kelor, bayam, kangkung, daun singkong, wortel, labu kuning, pepaya, mangga"},
  {k:"buah_sayur_lain", q:"Makan buah atau sayur lainnya?", ex:"Pisang, jeruk, semangka, tomat, kol, buncis, terong, tauge"}
];
const JENIS_INTERVENSI = ["PMT lokal","PMT pabrikan","Konseling PMBA","Kelas Ibu Balita","Rujukan","Lainnya"];
const EXPORT_COLS = ["No","NIK","Nama","tgl_monitoring","asi","sereal","kacang","susu","daging/unggas","telur","buah_sayur_vita","buah_sayur_lain","dapat_intervensi"];

/* ============ UTIL ============ */
const $app = document.getElementById("app");
const $ov = document.getElementById("overlay");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymdOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayYmd = () => ymdOf(new Date());
const parseYmd = s => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m?{y:+m[1],m:+m[2],d:+m[3]}:null; };
function ageMonths(dob, at){ const a=parseYmd(dob), b=parseYmd(at); if(!a||!b) return null;
  let mo=(b.y-a.y)*12+(b.m-a.m); if(b.d<a.d) mo--; return mo; }
function lastDay(y,m){ return new Date(y,m,0).getDate(); }
function periodeLabel(p){ const [y,m]=p.split("-").map(Number); return BULAN[m-1]+" "+y; }
function periodeRange(p){ const [y,m]=p.split("-").map(Number); return {start:y+"-"+pad(m)+"-01", end:y+"-"+pad(m)+"-"+pad(lastDay(y,m)), y, m}; }
function prevMonth(p){ let [y,m]=p.split("-").map(Number); m--; if(m<1){m=12;y--;} return y+"-"+pad(m); }
function defaultPeriode(){ const d=new Date(); let y=d.getFullYear(), m=d.getMonth()+1;
  const nxt=BULAN_PANTAU.find(b=>b>=m); if(nxt) m=nxt; else {m=3;y++;} return y+"-"+pad(m); }
function periodeOptions(){ const y=new Date().getFullYear(); const out=[]; for(let yy=y-1;yy<=y+1;yy++) for(const m of BULAN_PANTAU) out.push(yy+"-"+pad(m)); return out; }
const clean = s => String(s==null?"":s).replace(/ /g," ").trim();
const normH = s => clean(s).toLowerCase().replace(/[^a-z0-9]/g,"");
const nikOk = n => /^\d{16}$/.test(n||"");
const fmtDate = s => { const p=parseYmd(s); return p? p.d+" "+BULAN[p.m-1].slice(0,3)+" "+p.y : "-"; };
const pct = (a,b) => b? Math.round(a*100/b) : 0;
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
async function hashPin(pin){
  const s="mpasi-mcl|"+pin;
  try{ if(crypto && crypto.subtle){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join(""); } }catch(e){}
  let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return "d"+(h>>>0).toString(16);
}
function scoreOf(r){ return FOODS.reduce((a,f)=>a+(r[f.k]===1?1:0),0); }

/* ============ PENYIMPANAN ============ */
let storageOk = true;
function blankDB(){ return {versi:1, pengaturan:{periode:defaultPeriode(), waktu:""}, petugas:[], sasaran:{}, pemantauan:{}, sesi:null, demo:false, server:null, antri:{p:{},s:{},u:{},set:false}, lastSync:""}; }
let DB = blankDB();
function load(){ try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ DB=Object.assign(blankDB(), JSON.parse(raw)); DB.antri=Object.assign({p:{},s:{},u:{},set:false}, DB.antri||{}); return true; } }catch(e){ storageOk=false; } return false; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); storageOk=true; }catch(e){ storageOk=false; } }

/* ============ STATE UI ============ */
const UI = { view:"beranda", q:"", desa:"", pos:"", status:"semua", formKey:null, draft:null, impor:null, imporErr:null, showErr:false };
function me(){ return DB.petugas.find(p=>p.id===DB.sesi && p.aktif!==false); }
function aktifPetugas(){ return DB.petugas.filter(u=>u.aktif!==false); }
function isKoor(){ const u=me(); return u && u.peran==="koordinator"; }
function per(){ return DB.pengaturan.periode; }
function sasaranList(p){ return DB.sasaran[p||per()] || []; }
function rawPantau(p){ const k=p||per(); if(!DB.pemantauan[k]) DB.pemantauan[k]={}; return DB.pemantauan[k]; }
function pantauMap(p){ const raw=rawPantau(p); const o={}; for(const k in raw) if(raw[k] && !raw[k].dihapus) o[k]=raw[k]; return o; }
/* antrean data yang belum terkirim ke server */
function isDemoKey(p,key){ const s=(DB.sasaran[p]||[]).find(x=>keyOf(x)===key); return !!(s&&s.demo); }
function markP(p,key){ if(isDemoKey(p,key)) return; DB.antri.p[p+"|"+key]=Date.now(); scheduleSync(); }
function markS(p,s){ if(s.demo) return; s.waktuUbah=new Date().toISOString(); DB.antri.s[p+"|"+keyOf(s)]=Date.now(); scheduleSync(); }
function markU(u){ u.waktuUbah=new Date().toISOString(); DB.antri.u[u.id]=Date.now(); scheduleSync(); }
function markSet(){ DB.pengaturan.waktu=new Date().toISOString(); DB.antri.set=true; scheduleSync(); }
function pendingCount(){ const a=DB.antri; return Object.keys(a.p).length+Object.keys(a.s).length+Object.keys(a.u).length+(a.set?1:0); }
function markAllLocal(){
  for(const p of Object.keys(DB.sasaran)) for(const s of DB.sasaran[p]) if(!s.demo){ s.waktuUbah=s.waktuUbah||new Date().toISOString(); DB.antri.s[p+"|"+keyOf(s)]=Date.now(); }
  for(const p of Object.keys(DB.pemantauan)) for(const k of Object.keys(DB.pemantauan[p])) if(!isDemoKey(p,k)) DB.antri.p[p+"|"+k]=Date.now();
  for(const u of DB.petugas){ u.waktuUbah=u.waktuUbah||new Date().toISOString(); DB.antri.u[u.id]=Date.now(); }
  if(!DB.pengaturan.waktu) DB.pengaturan.waktu=new Date().toISOString();
  DB.antri.set=true;
}
function keyOf(s){ return s.nik ? s.nik : ("N:"+s.nama+"|"+s.tglLahir); }

/* ============ DATA CONTOH ============ */
function seedDemo(){
  const p=per(); const {y,m}=periodeRange(p);
  const desa=[["MONCONGLOE","PAMANJENGAN"],["MONCONGLOE","BIRING JE'NE"],["MONCONGLOE BULU","TAMMU-TAMMU"],["MONCONGLOE BULU","DICCEKANG"],["MONCONGLOE LAPPARA","ASABRI"],["MONCONGLOE LAPPARA","LEKO"],["BONTO MARANNU","BALLAPATI"],["BONTO BUNGA","MANJALLING"]];
  const nama=["NUR AISYAH (CONTOH)","MUH. RIZKI (CONTOH)","SITTI HALIMAH (CONTOH)","AHMAD FAUZAN (CONTOH)","ANDI NURUL (CONTOH)","MUH. ARKAN (CONTOH)","FATIMAH AZZAHRA (CONTOH)","RAHMAT HIDAYAT (CONTOH)","ZASKIA PUTRI (CONTOH)","MUH. ALIF (CONTOH)","NAYLA RAMADHANI (CONTOH)","DAFFA PRATAMA (CONTOH)","KHAIRUNNISA (CONTOH)","MUH. YUSUF (CONTOH)","AINUN (CONTOH)","FIKRI (CONTOH)"];
  const tb=["Normal","Normal","Pendek","Normal","Sangat Pendek","Normal","Normal","Pendek","Normal","Normal","Normal","Normal","Pendek","Normal","Normal","Normal"];

/* ============ IMPOR FILE E-PPGBM ============ */
function looksHtml(buf){ const u=new Uint8Array(buf.slice(0,600)); let s=""; for(const b of u) s+=String.fromCharCode(b); return /^\s*(﻿)?\s*</.test(s) && /<(html|table|!doctype)/i.test(s); }
function decodeText(buf){ let t; try{ t=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ t=new TextDecoder("windows-1252").decode(buf); } return t; }
function rowsFromHtml(text){
  const doc=new DOMParser().parseFromString(text,"text/html");
  const tables=[...doc.querySelectorAll("table")];
  if(!tables.length){
    if(/frameset|sheet001\.htm/i.test(text)) throw new Error("File ini hanya berisi 'bingkai' tanpa data (format Excel Web Page). Buka file di Excel, lalu Save As → Excel Workbook (.xlsx), atau unduh ulang file asli dari e-PPGBM tanpa di-save ulang.");
    throw new Error("Tidak ditemukan tabel data di file ini.");
  }
  let best=tables[0]; for(const t of tables) if(t.rows.length>best.rows.length) best=t;
  return [...best.rows].map(tr=>[...tr.cells].map(td=>clean(td.textContent)));
}
function rowsFromWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array",cellDates:false,raw:false});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
}
function toYmd(v){
  if(v==null||v==="") return "";
  if(typeof v==="number"){ const d=XLSX.SSF.parse_date_code(v); return d? d.y+"-"+pad(d.m)+"-"+pad(d.d) : ""; }
  if(v instanceof Date) return ymdOf(v);
  const s=clean(v); let m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(s))) return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  return "";
}
function toNik(v){
  if(v==null) return "";
  if(typeof v==="number") return Number.isFinite(v)? Math.round(v).toString() : "";
  return clean(v).replace(/^'/,"").replace(/\s+/g,"");
}
const COLMAP = {nik:["nik"], nama:["nama","namaanak","namabalita"], jk:["jk","jeniskelamin"], tglLahir:["tgllahir","tanggallahir"], namaOrtu:["namaortu","namaorangtua"],
  desa:["desakel","desa","kelurahan"], posyandu:["posyandu"], bbu:["bbu"], tbu:["tbu"], bbtb:["bbtb"], tglUkur:["tanggalpengukuran","tglpengukuran","tglukur"]};
function parseRows(rows, fname){
  let hi=-1, idx={};
  for(let i=0;i<Math.min(rows.length,15);i++){ const h=(rows[i]||[]).map(normH); if(h.includes("nik") && h.includes("nama")){ hi=i; h.forEach((x,j)=>{ for(const k in COLMAP) if(COLMAP[k].includes(x) && idx[k]==null) idx[k]=j; }); break; } }
  if(hi<0) throw new Error(fname+": baris judul kolom (NIK, Nama) tidak ditemukan. Pastikan ini laporan Daftar Anak Berdasarkan Status Gizi dari e-PPGBM.");
  if(idx.tglLahir==null) throw new Error(fname+": tidak ada kolom Tgl Lahir, jadi usia anak tidak bisa dihitung. Gunakan laporan Daftar Anak Berdasarkan Status Gizi (bukan file Format Import).");
  const out=[];
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]||[]; const g=k=> idx[k]==null? null : r[idx[k]];
    const nama=clean(g("nama")); if(!nama) continue;
    out.push({nik:toNik(g("nik")), nama, jk:clean(g("jk")).toUpperCase().slice(0,1), tglLahir:toYmd(g("tglLahir")), namaOrtu:clean(g("namaOrtu")), desa:clean(g("desa")).toUpperCase(), posyandu:clean(g("posyandu")).toUpperCase(),
      bbu:clean(g("bbu")), tbu:clean(g("tbu")), bbtb:clean(g("bbtb")), tglUkur:toYmd(g("tglUkur")), file:fname});
  }
  if(!out.length) throw new Error(fname+": tidak ada baris data anak.");
  return out;
}
async function readImportFile(file){
  const buf=await file.arrayBuffer();
  const rows = looksHtml(buf) ? rowsFromHtml(decodeText(buf)) : rowsFromWorkbook(buf);
  return parseRows(rows, file.name);
}
function buildImportPreview(all, p){
  const {start,end}=periodeRange(p);
  const map=new Map(); let dup=0;
  for(const r of all){ const k=r.nik? r.nik : ("N:"+r.nama+"|"+r.tglLahir);
    if(map.has(k)){ dup++; const o=map.get(k); if((r.tglUkur||"")>(o.tglUkur||"")) map.set(k,r); } else map.set(k,r); }
  const uniq=[...map.values()];
  const lolos=[], luar=[], tanpaTgl=[];
  for(const r of uniq){ if(!r.tglLahir){ tanpaTgl.push(r); continue; }
    const aStart=ageMonths(r.tglLahir,start), aEnd=ageMonths(r.tglLahir,end);
    if(aEnd>=6 && aStart<=23) lolos.push(r); else luar.push(r); }
  const bulanData={}; all.forEach(r=>{ if(r.tglUkur){ const b=r.tglUkur.slice(0,7); bulanData[b]=(bulanData[b]||0)+1; } });
  const byDesa={}; lolos.forEach(r=>{ byDesa[r.desa||"(tanpa desa)"]=(byDesa[r.desa||"(tanpa desa)"]||0)+1; });
  const exist=new Set(sasaranList(p).filter(s=>!s.demo).map(keyOf));
  const baru=lolos.filter(r=>!exist.has(r.nik?r.nik:("N:"+r.nama+"|"+r.tglLahir))).length;
  return {p, totalBaris:all.length, dup, uniq:uniq.length, lolos, luar:luar.length, tanpaTgl, byDesa, bulanData,
    nikKosong:lolos.filter(r=>!r.nik), nikSalah:lolos.filter(r=>r.nik && !nikOk(r.nik)), baru, perbarui:lolos.length-baru,
    bulanCocok: Object.keys(bulanData).some(b=>b===p||b===prevMonth(p))};
}
function commitImport(pv){
  if(DB.demo) clearDemo();
  const p=pv.p; const list=sasaranList(p).slice(); const pos=new Map(list.map((s,i)=>[keyOf(s),i]));
  for(const r of pv.lolos){ const s={nik:r.nik, nama:r.nama, jk:r.jk, tglLahir:r.tglLahir, namaOrtu:r.namaOrtu, desa:r.desa, posyandu:r.posyandu, bbu:r.bbu, tbu:r.tbu, bbtb:r.bbtb, tglUkur:r.tglUkur, sumber:"impor"};
    const k=keyOf(s); if(pos.has(k)) list[pos.get(k)]=Object.assign({},list[pos.get(k)],s); else { pos.set(k,list.length); list.push(s); } }
  DB.sasaran[p]=list; pv.lolos.forEach(r=>{ const k=r.nik?r.nik:("N:"+r.nama+"|"+r.tglLahir); const s=list[pos.get(k)]; if(s) markS(p,s); }); DB.lastImport={waktu:new Date().toISOString(), jumlah:pv.lolos.length, oleh:me()?me().nama:""};
  save();
}

/* ============ EKSPOR ============ */
function exportRows(p){
  const pm=pantauMap(p); const rows=[], dibuang=[], manual=[];
  const list=sasaranList(p).slice().sort((a,b)=>(a.desa+a.posyandu+a.nama).localeCompare(b.desa+b.posyandu+b.nama));
  for(const s of list){ const r=pm[keyOf(s)]; if(!r) continue;
    if(!nikOk(s.nik)){ dibuang.push({s,alasan:s.nik?"NIK tidak 16 digit":"NIK kosong"}); continue; }
    if(s.sumber==="manual") manual.push(s);
    rows.push({s,r}); }
  return {rows,dibuang,manual};
}
function buildEppgbmXlsx(p){
  const {rows}=exportRows(p);
  const aoa=[EXPORT_COLS];
  rows.forEach(({s,r},i)=> aoa.push([String(i+1), s.nik, s.nama, r.tgl, ...FOODS.map(f=>String(r[f.k]?1:0)), String(r.intervensi?1:0)]));
  const ws={};
  aoa.forEach((row,ri)=>row.forEach((v,ci)=>{ ws[XLSX.utils.encode_cell({r:ri,c:ci})]={t:"s",v:String(v),z:"@"}; }));
  ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:EXPORT_COLS.length-1}});
  ws["!cols"]=[{wch:5},{wch:19},{wch:28},{wch:13},...FOODS.map(()=>({wch:10})),{wch:15}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Sheet1");
  return XLSX.write(wb,{bookType:"xlsx",type:"array"});
}
function buildRekapXlsx(p){
  const pm=pantauMap(p);
  const head=["No","NIK","Nama","JK","Tgl Lahir","Usia (bln)","Desa/Kel","Posyandu","BB/U","TB/U","BB/TB","Sumber","Status isian","tgl_monitoring",...FOODS.map(f=>f.k),"Skor (x/8)","dapat_intervensi","Jenis intervensi","Diisi oleh","Waktu ubah"];

      ...FOODS.map(f=>r?(r[f.k]?1:0):""), r?scoreOf(r):"", r?(r.intervensi?1:0):"", r?(r.jenis||[]).map(j=>j==="Lainnya"&&r.lainnya?("Lainnya: "+r.lainnya):j).join("; "):"", r?r.petugas:"", r?r.waktuUbah:""]); });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  for(let i=1;i<aoa.length;i++){ const c=ws[XLSX.utils.encode_cell({r:i,c:1})]; if(c){c.t="s";c.v=String(aoa[i][1]||"");c.z="@";} }

let dlCap=null;
async function saveFile(filename, data, mime){
  if(dlCap){ try{ await dlCap.save({filename, data: data instanceof ArrayBuffer? data.slice(0): data}); toast("File disiapkan: "+filename); return; }
    catch(e){ if(e && e.code==="declined") { toast("Unduhan dibatalkan"); return; } if(e && e.code!=="unavailable" && e.code!=="not_granted"){ toast("Gagal mengunduh: "+(e.message||e.code)); return; } } }
  const blob=new Blob([data],{type:mime||"application/octet-stream"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); toast("Diunduh: "+filename);
}

/* ---- sasaran ---- */
function riskTags(s){ const t=[];
  if(/sangat pendek|pendek/i.test(s.tbu||"")) t.push(`<span class="tag red">${/sangat/i.test(s.tbu)?"Sangat pendek":"Pendek"}</span>`);
  if(/gizi buruk|gizi kurang/i.test(s.bbtb||"")) t.push(`<span class="tag red">${esc(s.bbtb)}</span>`);
  else if(/kurang/i.test(s.bbu||"")) t.push(`<span class="tag amber">BB ${esc(s.bbu.toLowerCase())}</span>`);
  if(s.sumber==="manual") t.push(`<span class="tag blue">Manual</span>`);
  if(!nikOk(s.nik)) t.push(`<span class="tag amber">${s.nik?"NIK ≠16 digit":"Tanpa NIK"}</span>`);
  return t.join(" ");
}
function viewSasaran(){
  const p=per(); const all=sasaranList(p); const pm=pantauMap(p);
  const desaList=[...new Set(all.map(s=>s.desa))].filter(Boolean).sort();
  const posList=[...new Set(all.filter(s=>!UI.desa||s.desa===UI.desa).map(s=>s.posyandu))].filter(Boolean).sort();
  if(UI.pos && !posList.includes(UI.pos)) UI.pos="";
  const q=UI.q.trim().toLowerCase();
  let list=all.filter(s=>(!UI.desa||s.desa===UI.desa)&&(!UI.pos||s.posyandu===UI.pos)&&(!q||s.nama.toLowerCase().includes(q)||(s.nik||"").includes(q)||(s.namaOrtu||"").toLowerCase().includes(q)));
  const nDone=list.filter(s=>pm[keyOf(s)]).length;
  if(UI.status==="belum") list=list.filter(s=>!pm[keyOf(s)]); else if(UI.status==="sudah") list=list.filter(s=>pm[keyOf(s)]);
  const today=todayYmd(); const pr=periodeRange(p); const inPer=today>=pr.start&&today<=pr.end;
  const outAge=s=>{ if(!inPer||pm[keyOf(s)]) return false; const u=ageMonths(s.tglLahir,today); return u!=null&&(u<6||u>23); };
  const rank=s=> pm[keyOf(s)]?1:(outAge(s)?2:0);
  list.sort((a,b)=>{ const ra=rank(a), rb=rank(b); if(ra!==rb) return ra-rb; return (a.posyandu+a.nama).localeCompare(b.posyandu+b.nama); });
  const shown=list.slice(0,300);
  return `
  <section class="stack">
    <input type="search" id="fQ" placeholder="Cari nama anak, NIK, atau nama orang tua" value="${esc(UI.q)}" aria-label="Cari">
    <div class="grid2">
      <select id="fD" aria-label="Desa"><option value="">Semua desa</option>${desaList.map(d=>`<option ${d===UI.desa?"selected":""}>${esc(d)}</option>`).join("")}</select>
      <select id="fP" aria-label="Posyandu"><option value="">Semua posyandu</option>${posList.map(d=>`<option ${d===UI.pos?"selected":""}>${esc(d)}</option>`).join("")}</select>
    </div>
    <div class="spread"><div class="chips" role="group" aria-label="Status">
      ${[["semua","Semua"],["belum","Belum"],["sudah","Sudah"]].map(([k,l])=>`<button class="chip" data-st="${k}" aria-pressed="${UI.status===k}">${l}</button>`).join("")}
    </div><span class="small muted num">${nDone} sudah diisi</span></div>
  </section>
  ${all.length?(list.length?`<div class="list">${shown.map(s=>{ const r=pm[keyOf(s)]; const sc=r?scoreOf(r):null; const umur=ageMonths(s.tglLahir,r?r.tgl:today);
    return `<button class="item" data-open="${esc(keyOf(s))}">
      <span class="score ${r?(sc>=5?"done":"low"):"todo"}">${r?sc+"/8":"Belum"}</span>
      <span class="who"><span class="nm">${esc(s.nama)}</span>
        <span class="meta">${esc(s.jk||"-")} · ${umur!=null?umur+" bln":"usia ?"} · ${esc(s.posyandu||"-")}${s.namaOrtu?" · "+esc(s.namaOrtu):""}</span>
        ${riskTags(s)||outAge(s)||(r&&r.catatan)?`<span class="row" style="gap:4px">${r&&r.catatan?`<span class="tag amber">Diisi ganda</span> `:""}${outAge(s)?`<span class="tag grey">${umur<6?"Belum 6 bln hari ini":"Sudah 24 bln hari ini"}</span> `:""}${riskTags(s)}</span>`:""}
      </span></button>`; }).join("")}</div>
    ${list.length>shown.length?`<p class="small muted">Menampilkan 300 dari ${list.length}. Persempit dengan pencarian atau filter.</p>`:""}`
    :`<div class="card"><p class="muted small" style="margin:0">Tidak ada anak yang cocok dengan filter ini.</p></div>`)
  :`<div class="card"><p class="muted small" style="margin:0">Belum ada data sasaran untuk ${esc(periodeLabel(p))}.</p></div>`}
  <button class="btn block" data-go="tambah">+ Tambah anak manual</button>`;
}
function bindSasaran(){
  const q=document.getElementById("fQ"); let t;
  q.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(()=>{ UI.q=q.value; const pos=q.selectionStart; render(); const n=document.getElementById("fQ"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} },200); });
  document.getElementById("fD").onchange=e=>{ UI.desa=e.target.value; UI.pos=""; render(); };
  document.getElementById("fP").onchange=e=>{ UI.pos=e.target.value; render(); };
  $app.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ UI.status=b.dataset.st; render(); });
}

/* ---- form ---- */
function openForm(key){
  const s=sasaranList().find(x=>keyOf(x)===key); if(!s) return;
  const r=pantauMap()[key];
  const {start,end}=periodeRange(per()); const t=todayYmd();
  UI.formKey=key; UI.showErr=false;
  UI.draft = r ? JSON.parse(JSON.stringify(r)) : Object.assign({tgl:(t>=start&&t<=end)?t:"", intervensi:null, jenis:[], lainnya:""}, Object.fromEntries(FOODS.map(f=>[f.k,null])));
  go("form");
}
function formProblems(s,d){
  const P=[]; const {start,end}=periodeRange(per());
  if(!d.tgl) P.push("Isi tanggal monitoring.");
  else if(d.tgl<start||d.tgl>end) P.push("Tanggal monitoring harus di bulan "+periodeLabel(per())+".");
  else if(d.tgl>todayYmd()) P.push("Tanggal monitoring tidak boleh setelah hari ini.");
  const umur=d.tgl?ageMonths(s.tglLahir,d.tgl):null;
  if(umur!=null && (umur<6||umur>23)) P.push("Usia anak pada tanggal ini "+umur+" bulan. Hanya anak 6–23 bulan yang dipantau.");
  const kosong=FOODS.filter(f=>d[f.k]==null).length; if(kosong) P.push(kosong+" kelompok pangan belum dijawab.");
  if(d.intervensi==null) P.push("Jawab pertanyaan intervensi.");
  if(d.intervensi===1 && !(d.jenis||[]).length) P.push("Pilih minimal satu jenis intervensi.");
  return P;
}

    ${old?`<div class="banner info small"><div>Sudah diisi oleh <b>${esc(old.petugas)}</b>, ${esc(new Date(old.waktuUbah).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"}))}. Perubahan akan menimpa isian ini.${old.catatan?`<br><b>${esc(old.catatan)}</b>`:""}</div></div>`:""}

  <section class="card">
    <label class="f" for="fTgl">Tanggal monitoring<input type="date" id="fTgl" value="${esc(d.tgl)}" min="${start}" max="${end}"></label>

function bindForm(){

/* ---- rekap ---- */
function viewRekap(){
  const p=per(); const list=sasaranList(p); const pm=pantauMap(p);
  const rs=list.map(s=>({s,r:pm[keyOf(s)]})).filter(x=>x.r);
  const n=rs.length;
  const group=(keyFn)=>{ const g={}; list.forEach(s=>{ const k=keyFn(s)||"-"; g[k]=g[k]||{n:0,d:0,m:0}; g[k].n++; const r=pm[keyOf(s)]; if(r){ g[k].d++; if(scoreOf(r)>=5) g[k].m++; } }); return Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0])); };
  const desa=group(s=>s.desa);
  const jenis={}; rs.forEach(({r})=>(r.jenis||[]).forEach(j=>jenis[j]=(jenis[j]||0)+1));
  const byP={}; rs.forEach(({r})=>byP[r.petugas]=(byP[r.petugas]||0)+1);
  const umurG=[["6–8 bln",6,8],["9–11 bln",9,11],["12–23 bln",12,23]].map(([l,a,b])=>{ const x=rs.filter(({s,r})=>{const u=ageMonths(s.tglLahir,r.tgl); return u>=a&&u<=b;}); return [l,x.length,x.filter(({r})=>scoreOf(r)>=5).length]; });

    <div class="grid3">
      <div class="stat"><span class="v">${n}/${list.length}</span><span class="l">Sudah diisi</span></div>

      <div class="stat"><span class="v">${rs.filter(({r})=>r.intervensi).length}</span><span class="l">Dapat intervensi</span></div>
    </div>
    <p class="small muted" style="margin:0">Skor ≥5/8 adalah perkiraan MDD untuk pantauan internal. Kategori resmi tetap dari e-PPGBM setelah diunggah.</p>
  </section>
  <section class="card"><h2>Per desa</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Desa/Kel</th><th class="r">Anak</th><th class="r">Diisi</th><th class="r">%</th><th class="r">≥5/8</th></tr></thead>
    <tbody>${desa.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.n}</td><td class="r">${v.d}</td><td class="r">${pct(v.d,v.n)}%</td><td class="r">${v.d?pct(v.m,v.d)+"%":"–"}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Belum ada data</td></tr>`}</tbody></table></div>
    <details><summary>Per posyandu</summary><div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Posyandu</th><th class="r">Anak</th><th class="r">Diisi</th><th class="r">≥5/8</th></tr></thead>
    <tbody>${group(s=>s.posyandu).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${v.n}</td><td class="r">${v.d}</td><td class="r">${v.d?pct(v.m,v.d)+"%":"–"}</td></tr>`).join("")}</tbody></table></div></details>
  </section>
  <section class="card"><h2>Konsumsi per kelompok pangan</h2>
    <p class="small muted" style="margin:0">Persentase anak yang mengonsumsi kelompok pangan ini kemarin (n=${n}).</p>
    <div class="stack">${FOODS.map((f,i)=>{ const c=rs.filter(({r})=>r[f.k]===1).length; return `<div class="stack small" style="gap:4px"><div class="spread"><span style="font-weight:600">${i+1}. ${esc(f.k)}</span><span class="num muted">${c} anak · <b style="color:var(--ink)">${n?pct(c,n)+"%":"–"}</b></span></div><div class="progress" style="height:8px"><i style="width:${pct(c,n)}%"></i></div></div>`; }).join("")}</div>
  </section>

    <div class="tbl-wrap"><table><thead><tr><th>Umur</th><th class="r">Diisi</th><th class="r">Skor ≥5</th></tr></thead><tbody>
    ${umurG.map(([l,a,b])=>`<tr><td>${l}</td><td class="r">${a}</td><td class="r">${a?pct(b,a)+"%":"–"}</td></tr>`).join("")}</tbody></table></div>
  </section>

    <div class="tbl-wrap"><table><thead><tr><th>Jenis intervensi</th><th class="r">Anak</th></tr></thead><tbody>

/* ============ SINKRON GOOGLE SHEET ============ */
const SYNC={busy:false, err:"", timer:null};
function chipLabel(){
  if(!DB.server) return "Mode lokal";
  if(SYNC.busy) return "Menyinkron…";
  const n=pendingCount();
  if(!navigator.onLine) return n? "Offline · "+n+" antre" : "Offline";
  if(SYNC.err) return n? "Gagal · "+n+" antre" : "Gagal sinkron";
  if(n) return n+" belum terkirim";
  if(DB.lastSync){ const d=new Date(DB.lastSync); return "Tersinkron "+pad(d.getHours())+"."+pad(d.getMinutes()); }
  return "Belum sinkron";
}
function chip(){ const c=document.querySelector(".sync"); if(c) c.textContent=chipLabel(); }
function softRender(){ const a=document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=="file") { chip(); return; } if($ov.innerHTML) { chip(); return; } if(UI.view==="form"){ chip(); return; } render(); }
function scheduleSync(ms){ if(!DB.server) return; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(()=>sync(), ms||2500); }
function kodeSambung(){ if(!DB.server) return ""; return "MPASI1."+btoa(unescape(encodeURIComponent(JSON.stringify({u:DB.server.url,t:DB.server.token})))); }
function bacaKode(k){ k=(k||"").trim(); if(!k.startsWith("MPASI1.")) throw new Error("Kode sambung tidak dikenali. Minta kode terbaru ke koordinator.");
  const o=JSON.parse(decodeURIComponent(escape(atob(k.slice(7))))); if(!o.u||!o.t) throw new Error("Kode sambung tidak lengkap."); return {url:o.u, token:o.t}; }
async function api(action, extra, srv){
  srv=srv||DB.server; let res;
  try{ res=await fetch(srv.url,{method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(Object.assign({action, token:srv.token, oleh:me()?me().nama:""}, extra||{}))}); }
  catch(e){ throw new Error(navigator.onLine? "Tidak bisa menghubungi server. Periksa URL aplikasi web (harus berakhiran /exec)." : "Tidak ada sinyal internet."); }
  let j; try{ j=await res.json(); }catch(e){ throw new Error("Jawaban server tidak terbaca. Pastikan deployment Apps Script diatur: Jalankan sebagai Saya, akses Siapa saja."); }
  if(!j.ok) throw new Error(j.error||"Server menolak permintaan."); return j;
}
const splitKey=k=>{ const i=k.indexOf("|"); return [k.slice(0,i), k.slice(i+1)]; };
async function sync(manual){
  if(!DB.server || SYNC.busy) return;
  if(!navigator.onLine){ chip(); if(manual) toast("Tidak ada sinyal. Data tetap tersimpan dan akan dikirim nanti."); return; }
  SYNC.busy=true; SYNC.err=""; chip();
  try{
    const a=DB.antri; const snapP=Object.assign({},a.p), snapS=Object.assign({},a.s), snapU=Object.assign({},a.u), snapSet=a.set, snapW=DB.pengaturan.waktu;
    const sas=[], pem=[];
    for(const k of Object.keys(snapS)){ const [p,key]=splitKey(k); const x=(DB.sasaran[p]||[]).find(y=>keyOf(y)===key); if(x && !x.demo) sas.push(Object.assign({periode:p, key}, x)); }
    for(const k of Object.keys(snapP)){ const [p,key]=splitKey(k); const r=(DB.pemantauan[p]||{})[key]; const x=(DB.sasaran[p]||[]).find(y=>keyOf(y)===key);
      if(r && !(x && x.demo)) pem.push(Object.assign({periode:p, key, nik:x?x.nik:"", nama:x?x.nama:""}, r)); }
    const ptg=Object.keys(snapU).map(id=>DB.petugas.find(u=>u.id===id)).filter(Boolean).map(u=>({id:u.id, nama:u.nama, peran:u.peran, pinHash:u.pinHash, aktif:u.aktif!==false, waktuUbah:u.waktuUbah}));
    const setg=snapSet? {periode:DB.pengaturan.periode, periodeWaktu:DB.pengaturan.waktu||""} : null;
    if(sas.length||pem.length||ptg.length||setg){
      const CH=250; const n=Math.max(sas.length, pem.length, 1);
      for(let i=0;i<n;i+=CH) await api("push", {sasaran:sas.slice(i,i+CH), pemantauan:pem.slice(i,i+CH), petugas:i===0?ptg:[], pengaturan:i===0?setg:null});
      for(const k in snapP) if(a.p[k]===snapP[k]) delete a.p[k];
      for(const k in snapS) if(a.s[k]===snapS[k]) delete a.s[k];
      for(const k in snapU) if(a.u[k]===snapU[k]) delete a.u[k];
      if(snapSet && DB.pengaturan.waktu===snapW) a.set=false;
      save();
    }
    await pullMerge(per(), 0);
    DB.lastSync=new Date().toISOString(); save();
    if(manual) toast("Sinkron selesai");
  }catch(e){ SYNC.err=e.message||String(e); if(manual) toast(SYNC.err); }
  finally{ SYNC.busy=false; softRender(); }
}
async function pullMerge(p, depth){
  const j=await api("pull", {periode:p});
  const sp=j.pengaturan||{};
  if(sp.periode && !DB.antri.set && sp.periode!==DB.pengaturan.periode){ DB.pengaturan.periode=sp.periode; DB.pengaturan.waktu=sp.periodeWaktu||""; if(!depth) return pullMerge(sp.periode, 1); }
  for(const u of j.petugas||[]){ if(DB.antri.u[u.id]) continue; const i=DB.petugas.findIndex(x=>x.id===u.id);
    const o={id:u.id, nama:u.nama, peran:u.peran, pinHash:u.pinHash, aktif:u.aktif!==false, waktuUbah:u.waktuUbah};
    if(i<0) DB.petugas.push(o); else { const keepDef=DB.petugas[i].pinDefault && DB.petugas[i].pinHash===u.pinHash; DB.petugas[i]=Object.assign({}, DB.petugas[i], o); if(!keepDef) delete DB.petugas[i].pinDefault; } }
  const srvS=j.sasaran||[];
  if(srvS.length && DB.demo) clearDemo();
  const local=DB.sasaran[p]||[]; const out=[]; const seen=new Set(); const srvMap=new Map(srvS.map(x=>[x.key,x]));
  for(const x of local){ const k=keyOf(x); seen.add(k);
    if(DB.antri.s[p+"|"+k] || !srvMap.has(k)) out.push(x);
    else { const o=Object.assign({}, srvMap.get(k)); delete o.key; out.push(o); } }
  for(const x of srvS){ if(!seen.has(x.key)){ const o=Object.assign({}, x); delete o.key; out.push(o); } }
  DB.sasaran[p]=out;
  const raw=rawPantau(p);
  for(const r of j.pemantauan||[]){ const k=r.key; if(DB.antri.p[p+"|"+k]) continue; const o=Object.assign({}, r); delete o.key;
    if(!raw[k] || (o.waktuUbah||"")>=(raw[k].waktuUbah||"") || (o.catatan||"")!==(raw[k].catatan||"")) raw[k]=o; }
}
function localKosong(){
  const adaS=Object.values(DB.sasaran).some(l=>(l||[]).some(x=>!x.demo));
  const adaP=Object.keys(DB.pemantauan).some(p=>Object.keys(DB.pemantauan[p]).some(k=>!isDemoKey(p,k)));
  const hanyaDefault=DB.petugas.length<=1 && (!DB.petugas[0] || DB.petugas[0].pinDefault);
  return !adaS && !adaP && hanyaDefault;
}
async function hubungkan(srv){
  await api("ping", {}, srv);
  const kosong=localKosong();
  DB.server=srv; DB.lastSync=""; SYNC.err="";
  if(kosong){ const cur=me(); clearDemo(); DB.petugas=[]; DB.antri={p:{},s:{},u:{},set:false}; DB.sesi=null;
    await pullMerge(DB.pengaturan.periode, 0);
    if(!DB.petugas.length){ // server masih kosong: perangkat ini yang pertama
      DB.petugas=[cur || {id:uid(), nama:"Koordinator", peran:"koordinator", pinHash:await hashPin("1234"), pinDefault:true}]; DB.sesi=cur?cur.id:null; markAllLocal(); }
    DB.lastSync=new Date().toISOString(); save(); if(pendingCount()) await sync(); return "baru"; }
  markAllLocal(); save(); await sync(); return "gabung";
}

    <div class="row" style="justify-content:flex-end"><button class="btn" id="mNo">Batal</button><button class="btn primary" id="mOk">Sambungkan</button></div></div></div>`;
  document.getElementById("mNo").onclick=()=>$ov.innerHTML="";
  document.getElementById("mOk").onclick=async()=>{ const b=document.getElementById("mOk"), e=document.getElementById("kErr");
    try{ b.disabled=true; b.textContent="Menghubungkan…"; e.hidden=true; const kode=document.getElementById("kIn").value.trim(), u=document.getElementById("kUrl").value.trim(), t=document.getElementById("kTok").value.trim();
      let srv;
      if(kode.startsWith("MPASI1.")) srv=bacaKode(kode);
      else if(u||t){ if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) throw new Error("URL harus diawali https://script.google.com/ dan berakhiran /exec."); if(t.length<10) throw new Error("Isi token dari Apps Script (24 karakter)."); srv={url:u, token:t}; }
      else if(kode) throw new Error("Itu bukan kode sambung. Kalau yang Anda punya adalah token, isikan di kolom Token bersama URL aplikasi web.");
      else throw new Error("Isi kode sambung, atau URL dan token."); const hs=await hubungkan(srv);
      $ov.innerHTML=""; toast(hs==="baru"?"Tersambung. Silakan masuk dengan nama dan PIN Anda.":"Tersambung dan data perangkat ini dikirim."); render(); }
    catch(err){ e.textContent=err.message||String(err); e.hidden=false; b.disabled=false; b.textContent="Sambungkan"; } };
}
function viewServer(){
  if(!isKoor()) return `<div class="card">Hanya koordinator.</div>`;
  const srv=DB.server;
  if(!srv) return `
  <button class="btn sm" data-go="menu" style="align-self:flex-start">← Menu</button>
  <section class="card">
    <h2>Sambungkan ke Google Sheet</h2>
    <p class="small muted" style="margin:0">Isi dengan URL aplikasi web dan token dari Apps Script (lihat panduan pemasangan). Setelah tersambung, semua data di perangkat ini dikirim ke Google Sheet.</p>
    <label class="f" for="sUrl">URL aplikasi web<input type="text" id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label class="f" for="sTok">Token<input type="text" id="sTok" autocomplete="off" placeholder="24 karakter dari Apps Script"></label>
    <div id="sErr" class="banner err" hidden></div>
    <button class="btn primary" id="sBtn">Uji dan sambungkan</button>
    <p class="small muted" style="margin:0">Sinkron hanya berjalan di aplikasi yang dipasang dari GitHub Pages. Halaman pratinjau di Claude tidak bisa menghubungi server luar.</p>
  </section>`;
  const n=pendingCount();
  return `
  <button class="btn sm" data-go="menu" style="align-self:flex-start">← Menu</button>
  <section class="card">
    <div class="spread"><h2>Sambungan server</h2><span class="tag ${SYNC.err?"red":n?"amber":"green"}">${SYNC.err?"Ada masalah":n?n+" belum terkirim":"Tersinkron"}</span></div>
    <div class="small muted" style="overflow-wrap:anywhere">${esc(srv.url)}</div>
    <div class="small">Sinkron terakhir: <b>${DB.lastSync?esc(new Date(DB.lastSync).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})):"belum pernah"}</b></div>
    ${SYNC.err?`<div class="banner err"><div>${esc(SYNC.err)}</div></div>`:""}
    <button class="btn primary" data-act="syncNow">Sinkron sekarang</button>
  </section>
  <section class="card">
    <h2>Kode sambung untuk HP petugas</h2>
    <p class="small muted" style="margin:0">Kirim kode ini ke tiap petugas lewat <b>pesan pribadi</b> (bukan grup). Di HP petugas: buka aplikasi → <b>Sambungkan perangkat ini</b> → tempel kode. Siapa pun yang memegang kode ini bisa membaca data anak, jadi jangan disebar.</p>
    <textarea id="kodeS" rows="4" readonly style="font-size:12px">${esc(kodeSambung())}</textarea>
    <button class="btn" data-act="salinKode">Salin kode sambung</button>
  </section>
  <section class="card"><button class="btn danger" data-act="putuskan">Putuskan sambungan perangkat ini</button></section>`;
}
function bindServer(){
  const b=document.getElementById("sBtn"); if(!b) return;
  b.onclick=async()=>{ const url=document.getElementById("sUrl").value.trim(), token=document.getElementById("sTok").value.trim(), e=document.getElementById("sErr");
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){ e.innerHTML="<div>URL harus diawali https://script.google.com/ dan berakhiran /exec.</div>"; e.hidden=false; return; }
    if(token.length<10){ e.innerHTML="<div>Isi token dari Apps Script.</div>"; e.hidden=false; return; }
    b.disabled=true; b.textContent="Menghubungkan…";
    try{ await hubungkan({url, token}); toast("Tersambung ke Google Sheet"); render(); }
    catch(err){ e.innerHTML="<div>"+esc(err.message||String(err))+"</div>"; e.hidden=false; b.disabled=false; b.textContent="Uji dan sambungkan"; } };
}

const ACT={
  simpan(){
    const s=sasaranList().find(x=>keyOf(x)===UI.formKey); const d=UI.draft; const P=formProblems(s,d);
    if(P.length){ UI.showErr=true; keepScroll(); toast(P[0]); return; }
    const u=me(); const pm=pantauMap(); const old=pm[UI.formKey]; const now=new Date().toISOString(); const raw=rawPantau(); const prev=raw[UI.formKey];
    const rec={tgl:d.tgl, intervensi:d.intervensi, jenis:d.intervensi?d.jenis:[], lainnya:d.intervensi&&(d.jenis||[]).includes("Lainnya")?(d.lainnya||""):"",
      petugas:u.nama, petugasId:u.id, waktuInput:old?old.waktuInput:now, waktuUbah:now, catatan:prev&&!prev.dihapus?(prev.catatan||""):""};
    FOODS.forEach(f=>rec[f.k]=d[f.k]); raw[UI.formKey]=rec; markP(per(),UI.formKey); save();
    toast("Tersimpan: "+s.nama+" ("+scoreOf(rec)+"/8)"); UI.formKey=null; UI.draft=null; go("sasaran");
  },
  async hapusIsian(){ const s=sasaranList().find(x=>keyOf(x)===UI.formKey);
    if(!(await ask(`Hapus isian pemantauan <b>${esc(s.nama)}</b>? Anak tetap ada di daftar sasaran.`,"Hapus isian",true))) return;
    const raw=rawPantau(); raw[UI.formKey]=Object.assign({},raw[UI.formKey],{dihapus:true,waktuUbah:new Date().toISOString(),petugas:me().nama,petugasId:me().id}); markP(per(),UI.formKey); save(); toast("Isian dihapus"); go("sasaran"); },
  tambahSimpan(){
    const t=UI.tambah||{}; const e=[]; const nik=(t.nik||"").trim(); const nama=clean(t.nama);
    if(!nikOk(nik)) e.push("NIK harus 16 angka.");
    if(!nama) e.push("Isi nama anak.");
    if(!t.jk) e.push("Pilih jenis kelamin.");
    if(!t.tglLahir) e.push("Isi tanggal lahir.");
    if(!t.desa) e.push("Pilih desa.");
    const {start,end}=periodeRange(per());
    if(t.tglLahir){ const a=ageMonths(t.tglLahir,end), b=ageMonths(t.tglLahir,start); if(!(a>=6 && b<=23)) e.push("Anak tidak berusia 6–23 bulan di "+periodeLabel(per())+"."); }
    if(nik && sasaranList().some(s=>s.nik===nik)) e.push("NIK ini sudah ada di daftar sasaran.");
    const box=document.getElementById("tErr");
    if(e.length){ box.innerHTML="<div>"+e.map(esc).join("<br>")+"</div>"; box.hidden=false; return; }
    const s={nik, nama, jk:t.jk, tglLahir:t.tglLahir, namaOrtu:clean(t.namaOrtu), desa:t.desa, posyandu:clean(t.posyandu).toUpperCase(), bbu:"", tbu:"", bbtb:"", sumber:"manual", dibuatOleh:me().nama};
    DB.sasaran[per()]=sasaranList().concat([s]); markS(per(),s); save(); UI.tambah=null; toast("Anak ditambahkan"); openForm(keyOf(s));
  },
  imporSimpan(){ const pv=UI.impor; commitImport(pv); UI.impor=null; toast(pv.lolos.length+" anak tersimpan sebagai sasaran"); go("beranda"); },
  imporBatal(){ UI.impor=null; UI.imporErr=null; render(); },
  unduhEppgbm(){ try{ const p=per(); saveFile("MPASI_Moncongloe_"+p+".xlsx", buildEppgbmXlsx(p), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"); }catch(e){ toast("Gagal membuat file: "+e.message); } },
  unduhRekap(){ try{ const p=per(); saveFile("rekap_MPASI_"+p+".xlsx", buildRekapXlsx(p), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"); }catch(e){ toast("Gagal membuat file: "+e.message); } },
  cadSimpan(){ const x={aplikasi:"Pantau MP-ASI Moncongloe", versi:APP_VERSI, dibuat:new Date().toISOString(), oleh:me().nama, periode:per(), petugas:DB.petugas.map(u=>({id:u.id,nama:u.nama,peran:u.peran,pinHash:u.pinHash})), sasaran:DB.sasaran, pemantauan:DB.pemantauan};
    saveFile("cadangan_MPASI_"+me().nama.replace(/\W+/g,"_")+"_"+todayYmd()+".json", JSON.stringify(x), "application/json"); },
  async keluar(){ if(!(await ask("Keluar dari aplikasi? Data tetap tersimpan di perangkat ini.","Keluar"))) return; DB.sesi=null; save(); render(); },
  async tambahPetugas(){ const n=clean(document.getElementById("aNama").value); const pin=document.getElementById("aPin").value.trim(); const k=document.getElementById("aKoor").checked;
    if(!n) return toast("Isi nama petugas"); if(!/^\d{4,8}$/.test(pin)) return toast("PIN harus 4–8 angka");
    if(aktifPetugas().some(u=>u.nama.toLowerCase()===n.toLowerCase())) return toast("Nama sudah ada");
    const nu={id:uid(), nama:n, peran:k?"koordinator":"petugas", pinHash:await hashPin(pin)}; DB.petugas.push(nu); markU(nu); save(); toast("Petugas ditambahkan"); render(); },
  async hapusPetugas(b){ const u=DB.petugas.find(x=>x.id===b.dataset.id); if(!u) return;

  async gantiPin(b){ const u=DB.petugas.find(x=>x.id===b.dataset.id); if(!u) return;

      u.pinHash=await hashPin(pin); delete u.pinDefault; markU(u); save(); $ov.innerHTML=""; toast("PIN diganti"); render(); }; },
  async hapusDemo(){ if(!(await ask("Hapus semua data contoh?","Hapus",true))) return; clearDemo(); save(); render(); },

};
